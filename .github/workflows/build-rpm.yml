name: Build RPMs

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0)'
        required: true
        default: '0.1.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-rpm:
    name: Build on Rocky Linux ${{ matrix.rocky }}
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:${{ matrix.rocky }}
    defaults:
      run:
        shell: /bin/bash {0}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - rocky: '9'
            dist: el9
          - rocky: '10'
            dist: el10

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --allowerasing \
            git curl tar make \
            gcc gcc-c++ binutils glibc-devel \
            openssl openssl-devel \
            rpm-build rpmdevtools
          # ensure cc symlink exists (alternatives doesn't always fire in containers)
          ln -sf /usr/bin/gcc /usr/bin/cc
          # add standard system bin dirs to PATH for all subsequent steps
          echo "/usr/local/sbin" >> "$GITHUB_PATH"
          echo "/usr/local/bin"  >> "$GITHUB_PATH"
          echo "/usr/sbin"       >> "$GITHUB_PATH"
          echo "/usr/bin"        >> "$GITHUB_PATH"
          echo "/sbin"           >> "$GITHUB_PATH"
          echo "/bin"            >> "$GITHUB_PATH"
          rpmdev-setuptree

      - name: Install Node.js 24
        run: |
          # Use the distribution's AppStream module — avoids executing remote scripts.
          dnf module enable nodejs:24 -y 2>/dev/null || true
          dnf install -y nodejs

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Go 1.26
        env:
          GO_VERSION: "go1.26.3"
          GO_SHA256: "2b2cfc7148493da5e73981bffbf3353af381d5f93e789c82c79aff64962eb556"
        run: |
          curl -fsSL -o /tmp/go.tar.gz \
            "https://go.dev/dl/${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  /tmp/go.tar.gz" | sha256sum -c -
          tar -C /usr/local -xzf /tmp/go.tar.gz
          rm /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Resolve package version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Rust binaries
        env:
          CC: /usr/bin/gcc
          CXX: /usr/bin/g++
          RUSTFLAGS: "-C linker=/usr/bin/gcc"
        run: |
          cd fs_indexer    && cargo build --release
          cd ../fs_aggregator && cargo build --release

      - name: Build UI
        run: cd fs_ui && npm ci && npm run build

      - name: Generate Swagger docs and build API
        run: |
          cd fs_api
          # Pin to the version already declared in go.mod — avoids a moving target in the build path.
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          "$(go env GOPATH)/bin/swag" init -g main.go -o docs
          CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o fs_api .

      - name: Stage artifacts for rpmbuild
        run: |
          BUILD="$HOME/rpmbuild/BUILD"
          mkdir -p "$BUILD"

          cp fs_indexer/target/release/fs_indexer        "$BUILD/"
          cp fs_aggregator/target/release/fs_aggregator   "$BUILD/"
          cp fs_api/fs_api                                "$BUILD/"
          cp -r fs_ui/build                               "$BUILD/ui-build"
          cp fs_config_template.toml                       "$BUILD/"
          cp .github/rpm/cuttlefish-api.service            "$BUILD/"
          cp .github/rpm/cuttlefish-index.service          "$BUILD/"
          cp .github/rpm/cuttlefish-index.timer            "$BUILD/"
          cp .github/rpm/cuttlefish-aggregate.service      "$BUILD/"

      - name: Copy spec files
        run: cp .github/rpm/*.spec "$HOME/rpmbuild/SPECS/"

      - name: Build RPMs
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for spec in "$HOME/rpmbuild/SPECS/"*.spec; do
            rpmbuild -bb --define "pkg_version $VERSION" "$spec"
          done

      - name: Collect RPMs
        run: |
          mkdir dist
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload RPM as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuttlefish-${{ steps.ver.outputs.version }}.${{ matrix.dist }}.x86_64.rpm
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0

      - name: Upload RPMs to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*.rpm
