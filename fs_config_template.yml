database:
  host: localhost
  user: postgres
  password: postgres
  dbname: fs_index
  # require encrypts but does NOT authenticate the server — MITM-able — and is
  # for local/testing only. verify-full verifies the certificate against the
  # system trust store; "disable" must never be used in production.
  sslmode: verify-full

# --- fs_indexer ---
# Read only by fs_indexer. At least one scan root is required; threads defaults to 8.
#
# Use root_path for a single root, or root_paths for several. Multiple roots are
# walked in parallel by one indexer run, and must not overlap — the indexer
# refuses to start otherwise. `threads` is the size of the walker pool shared
# across all roots, not a per-root count.
#
# A run only prunes deleted entries from inside the roots it scanned, so
# separate roots can be indexed on separate schedules into one shared index.
indexer:
  root_path: /
  # root_paths:
  #   - /home
  #   - /srv/data
  #   - /mnt/archive
  threads: 8

# --- HTTP server ---
# The server refuses to start with neither TLS material nor allow_insecure_http.
# When tls_cert/tls_key are set it listens with TLS and the session cookie gains
# the Secure flag. Set allow_insecure_http: true to serve plain HTTP behind a
# TLS-terminating reverse proxy; the proxy's X-Forwarded-Proto then drives the
# cookie's Secure flag.
server:
  listen_addr: ":8080"
  # tls_cert: "/etc/cuttlefish/tls/cert.pem"
  # tls_key: "/etc/cuttlefish/tls/key.pem"
  # allow_insecure_http: true

# --- Browser UI ---
# Read only by fs_api. Applied when the page is served, so changing it needs a
# server restart but no UI rebuild. Defaults to "Cuttlefish" when unset.
ui:
  title: "Cuttlefish"     # browser tab title

auth:
  # Secret used to sign session tokens. Generate with: openssl rand -hex 32
  session_secret: "change-me-to-a-random-secret"

  # --- Local admin mode ---
  # Used when auth.oidc.issuer is empty or absent.
  # fs_api refuses to start while username/password are still these example values.
  local:
    username: admin
    password: changeme

  # --- OIDC / SSO mode ---
  # If issuer is set, OIDC is used and auth.local is ignored.
  # oidc:
  #   issuer: "https://accounts.google.com"
  #   client_id: "your-client-id"
  #   client_secret: "your-client-secret"
  #   redirect_url: "http://localhost:8080/auth/callback"
  #   allowed_users: ["auditor@example.com"]   # optional: only these identities get a session…
  #   allowed_domains: ["example.com"]         # …or only these email domains. Both unset = allow any verified identity.
