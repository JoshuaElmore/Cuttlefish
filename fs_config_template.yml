database:
  host: localhost
  user: postgres
  password: postgres
  dbname: fs_index
  sslmode: require        # disable | require | verify-full  (never use "disable" in production)

# --- fs_indexer ---
# Read only by fs_indexer. root_path is required; threads defaults to 8.
indexer:
  root_path: /
  threads: 8

# --- HTTP server ---
# Omit tls_cert / tls_key to run plain HTTP behind a TLS-terminating reverse proxy.
# When both are set the server listens with TLS and the session cookie gains Secure flag.
server:
  listen_addr: ":8080"
  # tls_cert: "/etc/cuttlefish/tls/cert.pem"
  # tls_key: "/etc/cuttlefish/tls/key.pem"

# --- MCP (Model Context Protocol) server ---
# Read only by fs_api. Exposes the index to AI clients as read-only tools over
# Streamable HTTP. Enabled by default and guarded by the same session auth as
# /api/*, so an MCP client authenticates with the token from the session cookie
# that POST /auth/login sets, sent as "Authorization: Bearer <token>".
mcp:
  enabled: true           # set false to not serve MCP at all
  path: "/mcp"            # endpoint path on the main HTTP server
  # listen_addr: ":8081"  # serve MCP on its own port instead of the main one
  # Optional static bearer credential for a headless client that cannot log in.
  # It opens the whole index — treat it like a password, keep it >= 32 chars.
  # Generate with: openssl rand -hex 32
  # token: "change-me-or-leave-empty"

# --- Browser UI ---
# Read only by fs_api. Applied when the page is served, so changing it needs a
# server restart but no UI rebuild. Defaults to "Cuttlefish" when unset.
ui:
  title: "Cuttlefish"     # browser tab title

auth:
  # Secret used to sign session tokens. Generate with: openssl rand -hex 32
  session_secret: "change-me-to-a-random-secret"

  # --- Local admin mode ---
  # Used when auth.oidc.issuer is empty or absent.
  local:
    username: admin
    password: changeme

  # --- OIDC / SSO mode ---
  # If issuer is set, OIDC is used and auth.local is ignored.
  # oidc:
  #   issuer: "https://accounts.google.com"
  #   client_id: "your-client-id"
  #   client_secret: "your-client-secret"
  #   redirect_url: "http://localhost:8080/auth/callback"
