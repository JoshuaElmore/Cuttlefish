basePath: /
definitions:
  main.DirAggregates:
    properties:
      atime_first:
        type: integer
      atime_last:
        type: integer
      ctime_first:
        type: integer
      ctime_last:
        type: integer
      file_count:
        type: integer
      mtime_first:
        type: integer
      mtime_last:
        type: integer
      total_size_bytes:
        type: integer
    type: object
  main.FileInfo:
    properties:
      aggregates:
        $ref: '#/definitions/main.DirAggregates'
      atime:
        type: integer
      ctime:
        type: integer
      file_type:
        type: integer
      gid:
        type: integer
      group:
        type: string
      mtime:
        type: integer
      path:
        type: string
      permissions:
        type: string
      size_bytes:
        type: integer
      uid:
        type: integer
      user:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for querying a high-performance filesystem index.
  title: File System Index API
  version: "1.0"
paths:
  /api/dir/stats:
    get:
      description: Returns detailed metadata for a specific directory. If include_stats=true,
        returns aggregated info from dir_stats.
      parameters:
      - description: The directory path for stats
        in: query
        name: path
        required: true
        type: string
      - description: Include aggregated stats from dir_stats table
        in: query
        name: include_stats
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.FileInfo'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get directory statistics
  /api/file/stats:
    get:
      description: Returns detailed metadata for a specific file. Returns 400 if the
        path is a directory.
      parameters:
      - description: The path to the file
        in: query
        name: path
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.FileInfo'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get detailed file statistics
  /api/list:
    get:
      description: Returns a list of files and directories within the specified path
        using high-performance hash lookup internally.
      parameters:
      - description: The directory path to list
        in: query
        name: path
        required: true
        type: string
      - description: Include aggregated stats from dir_stats table for directories
        in: query
        name: include_stats
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.FileInfo'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List directory contents
swagger: "2.0"
