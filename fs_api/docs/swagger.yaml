basePath: /
definitions:
  main.DirAggregates:
    properties:
      atime_first:
        type: integer
      atime_last:
        type: integer
      ctime_first:
        type: integer
      ctime_last:
        type: integer
      file_count:
        type: integer
      mtime_first:
        type: integer
      mtime_last:
        type: integer
      total_size_bytes:
        type: integer
    type: object
  main.FileInfo:
    properties:
      aggregates:
        $ref: '#/definitions/main.DirAggregates'
      atime:
        type: integer
      ctime:
        type: integer
      file_type:
        type: integer
      gid:
        type: integer
      group:
        type: string
      mtime:
        type: integer
      path:
        type: string
      permissions:
        type: string
      size_bytes:
        type: integer
      uid:
        type: integer
      user:
        type: string
    type: object
  main.UserStats:
    properties:
      file_count:
        type: integer
      id_type:
        type: string
      id_value:
        type: integer
      name:
        type: string
      total_size_bytes:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for querying a high-performance filesystem index.
  title: File System Index API
  version: "1.0"
paths:
  /api/dir/stats:
    get:
      description: Returns metadata for a single directory at the specified path,
        optionally including aggregated size and time stats.
      parameters:
      - description: The directory path
        in: query
        name: path
        required: true
        type: string
      - description: Include aggregated size and time stats from dir_stats table
        in: query
        name: include_stats
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.FileInfo'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get directory metadata
  /api/file/stats:
    get:
      description: Returns metadata for a single file at the specified path.
      parameters:
      - description: The file path
        in: query
        name: path
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.FileInfo'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get file metadata
  /api/group/list:
    get:
      description: Returns a sorted list of all groups and their total data usage.
      parameters:
      - description: 'Field to sort by (total_size_bytes, file_count, name). Default:
          total_size_bytes'
        in: query
        name: sort_by
        type: string
      - description: 'Sort order (ASC, DESC). Default: DESC'
        in: query
        name: order
        type: string
      - description: 'Number of items to return. Default: 100'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip. Default: 0'
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.UserStats'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List all groups with usage statistics
  /api/list:
    get:
      description: Returns a list of files and directories within the specified path
        using high-performance hash lookup internally.
      parameters:
      - description: The directory path to list
        in: query
        name: path
        required: true
        type: string
      - description: Include aggregated stats from dir_stats table for directories
        in: query
        name: include_stats
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.FileInfo'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List directory contents
  /api/user/list:
    get:
      description: Returns a sorted list of all users and their total data usage.
      parameters:
      - description: 'Field to sort by (total_size_bytes, file_count, name). Default:
          total_size_bytes'
        in: query
        name: sort_by
        type: string
      - description: 'Sort order (ASC, DESC). Default: DESC'
        in: query
        name: order
        type: string
      - description: 'Number of items to return. Default: 100'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip. Default: 0'
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.UserStats'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List all users with usage statistics
swagger: "2.0"
