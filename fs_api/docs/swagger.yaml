basePath: /
definitions:
  main.DirAggregates:
    properties:
      atime_first:
        type: integer
      atime_last:
        type: integer
      ctime_first:
        type: integer
      ctime_last:
        type: integer
      file_count:
        type: integer
      mtime_first:
        type: integer
      mtime_last:
        type: integer
      total_size_bytes:
        type: integer
    type: object
  main.FileInfo:
    properties:
      aggregates:
        $ref: '#/definitions/main.DirAggregates'
      atime:
        type: integer
      ctime:
        type: integer
      file_type:
        type: integer
      gid:
        type: integer
      group:
        type: string
      mtime:
        type: integer
      path:
        type: string
      permissions:
        type: string
      size_bytes:
        type: integer
      uid:
        type: integer
      user:
        type: string
    type: object
  main.ScanSession:
    properties:
      ended_at:
        type: integer
      files_scanned:
        type: integer
      scan_type:
        description: indexer | aggregator
        type: string
      session_id:
        type: string
      started_at:
        type: integer
      status:
        description: running | success | failed
        type: string
    type: object
  main.SearchRequest:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      order:
        description: ASC | DESC
        type: string
      rules:
        items:
          $ref: '#/definitions/main.SearchRule'
        type: array
      sort_by:
        description: path | size_bytes | uid | gid | file_type | mtime | atime | ctime
        type: string
    type: object
  main.SearchRule:
    properties:
      connector:
        description: AND | OR (relative to the previous rule)
        type: string
      field:
        description: path | uid | gid | file_type
        type: string
      negate:
        description: when true the whole condition is inverted ("path NOT contains
          foo")
        type: boolean
      operator:
        description: contains | equals | starts_with | regex | regex_i | not_equals
          | gt | lt
        type: string
      value:
        description: raw value; numeric fields parse this to an int
        type: string
    type: object
  main.UserStats:
    properties:
      file_count:
        type: integer
      id_type:
        type: string
      id_value:
        type: integer
      name:
        type: string
      total_size_bytes:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for querying a high-performance filesystem index.
  title: File System Index API
  version: "1.0"
paths:
  /api/dir/stats:
    get:
      description: Returns metadata for a single directory at the specified path,
        optionally including aggregated size and time stats.
      parameters:
      - description: The directory path
        in: query
        name: path
        required: true
        type: string
      - description: Include aggregated size and time stats from dir_stats table
        in: query
        name: include_stats
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.FileInfo'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get directory metadata
  /api/file/stats:
    get:
      description: Returns metadata for a single file at the specified path.
      parameters:
      - description: The file path
        in: query
        name: path
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.FileInfo'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get file metadata
  /api/group/list:
    get:
      description: Returns a sorted list of all groups and their total data usage.
      parameters:
      - description: 'Field to sort by (total_size_bytes, file_count, name). Default:
          total_size_bytes'
        in: query
        name: sort_by
        type: string
      - description: 'Sort order (ASC, DESC). Default: DESC'
        in: query
        name: order
        type: string
      - description: 'Number of items to return. Default: 100'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip. Default: 0'
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.UserStats'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List all groups with usage statistics
  /api/list:
    get:
      description: Returns a list of files and directories within the specified path
        using high-performance hash lookup internally.
      parameters:
      - description: The directory path to list
        in: query
        name: path
        required: true
        type: string
      - description: Include aggregated stats from dir_stats table for directories
        in: query
        name: include_stats
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.FileInfo'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List directory contents
  /api/scans:
    get:
      description: Returns fs_indexer and fs_aggregator run history (scan_sessions),
        newest first.
      parameters:
      - description: 'Number of items to return. Default: 50'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip. Default: 0'
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.ScanSession'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List scan sessions
  /api/search:
    post:
      consumes:
      - application/json
      description: Search files and directories using AND/OR conditions on path, uid,
        gid, file_type and size, with regex support and sortable output.
      parameters:
      - description: Search query
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.FileInfo'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Advanced filesystem search
  /api/user/list:
    get:
      description: Returns a sorted list of all users and their total data usage.
      parameters:
      - description: 'Field to sort by (total_size_bytes, file_count, name). Default:
          total_size_bytes'
        in: query
        name: sort_by
        type: string
      - description: 'Sort order (ASC, DESC). Default: DESC'
        in: query
        name: order
        type: string
      - description: 'Number of items to return. Default: 100'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip. Default: 0'
        in: query
        name: offset
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.UserStats'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List all users with usage statistics
swagger: "2.0"
